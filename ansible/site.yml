---
- name: Base configuration for every server
  hosts: all
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Configure database server
  hosts: db
  become: true
  vars:
    db_name: notes_db
    db_user: notes_user
    db_password: change_me

  tasks:
    - name: Install PostgreSQL and psycopg2
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present
        update_cache: true

    - name: Ensure PostgreSQL service is started and enabled
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Allow PostgreSQL to listen on all addresses
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Configure pg_hba.conf for scram-sha-256 authentication
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: "host all all 0.0.0.0/0 scram-sha-256"
        state: present
      notify: Restart PostgreSQL

    - name: Flush handlers before creating database objects
      ansible.builtin.meta: flush_handlers

    - name: Create database user
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
      become_user: postgres

    - name: Create application database
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      become_user: postgres

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Configure web servers
  hosts: web
  become: true
  vars:
    repo_url: https://github.com/ibrahem-abedalgader/devops-labs-fn373223045.git
    database_url: postgresql://notes_user:change_me@db:5432/notes_db

  tasks:
    - name: Install required apt packages
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging
          - git
        state: present
        update_cache: true

    - name: Clone repository into /opt/notes
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: /opt/notes
        version: main
        force: true
      notify: Restart notes

    - name: Install requirements into virtualenv
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv

    - name: Deploy systemd service unit
      ansible.builtin.template:
        src: templates/notes.service.j2
        dest: /etc/systemd/system/notes.service
      notify: Restart notes

    - name: Start and enable notes service
      ansible.builtin.systemd:
        name: notes
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart notes
      ansible.builtin.systemd:
        name: notes
        state: restarted
        daemon_reload: true
- name: Configure load balancer
  hosts: lb
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Configure nginx site from template
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Reload nginx

    - name: Ensure nginx service is started
      ansible.builtin.service:
        name: nginx
        state: started

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded                